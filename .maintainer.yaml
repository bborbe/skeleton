# Opts this repo into maintainer-bot behaviors. Read per-repo by the maintainer agents.
#
# release.autoRelease: when true, the github-release watcher emits a release task
# when CHANGELOG.md has a non-empty "## Unreleased" section and master has moved;
# the github-releaser agent then rewrites "## Unreleased" -> "## vX.Y.Z", commits,
# tags, and pushes directly to the default branch.
#
# Absence of this file (or release.autoRelease: false) = opted out (no auto-release).
#
# prReviewer.autoApprove: when true, the pr-reviewer agent posts verdict "approve"
# as an APPROVE review (counts toward branch-protection); false/absent demotes it
# to a COMMENT. Replaces the legacy .pr-reviewer.yaml (removed in a follow-up once
# the new pr-reviewer image is deployed to prod).
#
# goUpdate.autoUpdate: when true, github-update-go-watcher may file a Go-version
# update task for this repo. It is the second of two gates — the repo must ALSO be
# in the watcher's REPO_ALLOWLIST — so this key alone never widens scope.
# Absent file, absent section, and absent key all read as false (trust gate), which
# means a repo opts in deliberately and never by accident.
#
# autoMerge.trivial: when true, the github-pr-watcher may apply the auto-merge
# label to mechanically trivial PRs (version bumps per the allow-list) so GitHub
# auto-merges them on green. The watcher's TRIVIAL_AUTO_MERGE flag must also be
# enabled. Dev e2e canary (2026-08-23).
release:
  autoRelease: true
  changelogRewrite: false
prReviewer:
  autoApprove: true
goUpdate:
  autoUpdate: true
autoMerge:
  trivial: true
